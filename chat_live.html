<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MiganCore — Chat</title>
  <meta name="description" content="ADO yang belajar dari interaksi — brain Indonesia, voice direct, action over advice.">
  <meta name="theme-color" content="#ff8a24">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MiganCore">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" href="/favicon.svg">
  <link rel="manifest" href="/manifest.json">

  <!-- Resource hints — speed up critical-path origins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="https://unpkg.com">
  <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
  <link rel="preconnect" href="https://api.migancore.com">
  <link rel="preload" as="script" href="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin>
  <link rel="preload" as="script" href="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin>

  <!-- Fonts (display=swap = render text immediately with fallback, swap when ready) -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- React 18 + Babel -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Day 40: CompressorJS for client-side image downscale (12KB gzipped, no build) -->
  <!-- Used to keep base64 attachments under 1MB so React state doesn't freeze on big images -->
  <script src="https://cdn.jsdelivr.net/npm/compressorjs@1.2.1/dist/compressor.min.js"></script>

  <!-- Cycle 11 UI: markdown render + sanitize + code highlight (artifact/mini-app + rich replies) -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.9.0/highlight.min.js"></script>
  <!-- hljs github-dark theme INLINED (CSP style-src blocks external css from jsdelivr) -->
  <style>
    .hljs{color:#c9d1d9;background:transparent}
    .hljs-comment,.hljs-quote{color:#8b949e}
    .hljs-keyword,.hljs-selector-tag,.hljs-built_in,.hljs-name,.hljs-tag{color:#ff7b72}
    .hljs-string,.hljs-title,.hljs-section,.hljs-attribute,.hljs-literal,.hljs-template-tag,.hljs-template-variable,.hljs-type,.hljs-addition{color:#a5d6ff}
    .hljs-number,.hljs-symbol,.hljs-bullet,.hljs-meta,.hljs-link{color:#79c0ff}
    .hljs-variable,.hljs-attr{color:#ffa657}
    .hljs-emphasis{font-style:italic}.hljs-strong{font-weight:bold}
    .hljs-function .hljs-title,.hljs-title.function_{color:#d2a8ff}
    .hljs-deletion{color:#ffa198}
  </style>
  <!-- Cycle 11 UI: document upload text extraction (PDF via pdf.js UMD, DOCX via mammoth) -->
  <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
  <script>
    if (window.pdfjsLib) {
      window.pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js";
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mammoth@1.7.2/mammoth.browser.min.js"></script>

  <style>
    /* ===========================
       DESIGN SYSTEM TOKENS
    =========================== */
    :root {
      --bg-0: #07100e;
      --bg-1: #0d1f1a;
      --bg-2: #142920;
      --orange: #ff8a24;
      --orange-dim: rgba(255, 138, 36, 0.12);
      --orange-border: rgba(255, 138, 36, 0.4);
      --green: #2fe39a;
      --green-dim: rgba(47, 227, 154, 0.10);
      --green-border: rgba(47, 227, 154, 0.25);
      --text: #e9f5ee;
      --text-dim: #93b3a5;
      --border: rgba(47, 227, 154, 0.15);
      --mono: 'JetBrains Mono', monospace;
      --display: 'Orbitron', sans-serif;
      --sans: 'Inter', sans-serif;
      --radius: 8px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg-0);
      color: var(--text);
      font-family: var(--sans);
      overflow: hidden;
    }

    /* ===========================
       BOOT SEQUENCE
    =========================== */
    .boot-screen {
      position: fixed;
      inset: 0;
      background: var(--bg-0);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      gap: 2rem;
    }

    .boot-logo {
      font-family: var(--display);
      font-size: clamp(1.5rem, 4vw, 2.25rem);
      font-weight: 900;
      color: var(--orange);
      letter-spacing: 0.2em;
    }

    .boot-terminal {
      font-family: var(--mono);
      font-size: 0.8rem;
      color: var(--text-dim);
      width: min(420px, 90vw);
      padding: 1.25rem;
      background: var(--bg-1);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }

    .boot-line {
      padding: 2px 0;
      opacity: 0;
      animation: fadeSlide 0.25s ease forwards;
    }

    .boot-line.ok { color: var(--green); }
    .boot-line.dim { color: var(--text-dim); }

    @keyframes fadeSlide {
      from { opacity: 0; transform: translateX(-6px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    /* ===========================
       LOGIN SCREEN
    =========================== */
    .auth-screen {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      background: var(--bg-0);
    }

    .auth-card {
      width: min(420px, 100%);
      background: var(--bg-1);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2rem;
    }

    .auth-logo {
      font-family: var(--display);
      font-size: 1.2rem;
      font-weight: 900;
      color: var(--orange);
      letter-spacing: 0.18em;
      text-align: center;
      margin-bottom: 0.3rem;
    }

    .auth-tagline {
      font-family: var(--mono);
      font-size: 0.65rem;
      color: var(--text-dim);
      text-align: center;
      letter-spacing: 0.1em;
      margin-bottom: 1.75rem;
    }

    .tabs {
      display: flex;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      margin-bottom: 1.5rem;
    }

    .tab {
      flex: 1;
      padding: 0.6rem;
      background: transparent;
      border: none;
      color: var(--text-dim);
      font-family: var(--mono);
      font-size: 0.72rem;
      cursor: pointer;
      letter-spacing: 0.1em;
      transition: all 0.2s;
    }

    .tab.active {
      background: var(--orange-dim);
      color: var(--orange);
    }

    .form-group { margin-bottom: 0.9rem; }

    .form-label {
      display: block;
      font-family: var(--mono);
      font-size: 0.65rem;
      color: var(--text-dim);
      letter-spacing: 0.1em;
      margin-bottom: 0.35rem;
    }

    .form-input {
      width: 100%;
      padding: 0.6rem 0.875rem;
      background: var(--bg-2);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-family: var(--sans);
      font-size: 0.85rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-input:focus { border-color: var(--orange); }
    .form-input::placeholder { color: var(--text-dim); }

    .btn-primary {
      width: 100%;
      padding: 0.75rem;
      background: var(--orange);
      border: none;
      border-radius: var(--radius);
      color: #000;
      font-family: var(--display);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 0.5rem;
    }

    .btn-primary:hover:not(:disabled) {
      background: #ff9c40;
      transform: translateY(-1px);
    }

    .btn-primary:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }

    .form-error {
      padding: 0.6rem 0.875rem;
      background: rgba(255, 68, 68, 0.1);
      border: 1px solid rgba(255, 68, 68, 0.3);
      border-radius: 6px;
      font-size: 0.78rem;
      color: #ff6b6b;
      margin-bottom: 1rem;
    }

    /* ===========================
       APP LAYOUT
    =========================== */
    .app {
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* ===========================
       SIDEBAR
    =========================== */
    .sidebar {
      width: 256px;
      background: var(--bg-1);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      padding: 1.25rem 0.875rem;
    }

    .sidebar-brand {
      display: flex;
      align-items: center;
      gap: 0.625rem;
      padding-bottom: 1.25rem;
      margin-bottom: 1.25rem;
      border-bottom: 1px solid var(--border);
    }

    .brand-name {
      font-family: var(--display);
      font-size: 0.875rem;
      font-weight: 700;
      color: var(--orange);
      letter-spacing: 0.12em;
    }

    .btn-new {
      width: 100%;
      padding: 0.6rem 0.875rem;
      background: var(--orange-dim);
      border: 1px solid var(--orange-border);
      border-radius: 6px;
      color: var(--orange);
      font-family: var(--mono);
      font-size: 0.7rem;
      cursor: pointer;
      letter-spacing: 0.08em;
      transition: all 0.2s;
      text-align: left;
      margin-bottom: 1rem;
    }

    .btn-new:hover { background: rgba(255, 138, 36, 0.22); }

    .section-label {
      font-family: var(--mono);
      font-size: 0.62rem;
      color: var(--text-dim);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 0.5rem;
    }

    .conv-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 2px;
      margin-bottom: 1rem;
    }

    .conv-item {
      padding: 0.55rem 0.75rem;
      border-radius: 5px;
      cursor: pointer;
      font-size: 0.78rem;
      color: var(--text-dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: all 0.15s;
    }

    .conv-item:hover, .conv-item.active {
      background: var(--green-dim);
      color: var(--text);
    }

    .empty-convs {
      font-size: 0.7rem;
      color: var(--text-dim);
      padding: 0.4rem 0.75rem;
      font-family: var(--mono);
    }

    .sidebar-footer {
      border-top: 1px solid var(--border);
      padding-top: 1rem;
    }

    .user-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.75rem;
    }

    .user-avatar {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--green-dim);
      border: 1px solid var(--green-border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--mono);
      font-size: 0.6rem;
      color: var(--green);
      flex-shrink: 0;
      font-weight: 500;
    }

    .user-email {
      font-size: 0.7rem;
      color: var(--text-dim);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .nav-links {
      display: flex;
      gap: 0.4rem;
      margin-bottom: 0.6rem;
    }
    .nav-link-btn {
      flex: 1;
      padding: 0.35rem 0.25rem;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 5px;
      color: var(--text-dim);
      font-family: var(--mono);
      font-size: 0.6rem;
      cursor: pointer;
      letter-spacing: 0.05em;
      text-align: center;
      text-decoration: none;
      transition: all 0.2s;
      display: block;
    }
    .nav-link-btn:hover { border-color: var(--green); color: var(--green); }

    .btn-logout {
      width: 100%;
      padding: 0.45rem;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-dim);
      font-family: var(--mono);
      font-size: 0.65rem;
      cursor: pointer;
      letter-spacing: 0.08em;
      transition: all 0.2s;
    }

    .btn-logout:hover { border-color: #ff5555; color: #ff6b6b; }

    /* ===========================
       CHAT AREA
    =========================== */
    .chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-width: 0;
    }

    .chat-header {
      padding: 0.875rem 1.5rem;
      border-bottom: 1px solid var(--border);
      background: var(--bg-1);
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .dot-pulse {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
      flex-shrink: 0;
      animation: livePulse 2.2s ease-in-out infinite;
      transition: background 0.3s;
    }

    /* Day 67: orange + fast pulse when streaming */
    .dot-pulse.streaming {
      background: var(--orange);
      animation: livePulseActive 0.7s ease-in-out infinite;
    }

    @keyframes livePulse {
      0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(47,227,154,0.7); }
      50% { opacity: 0.75; box-shadow: 0 0 0 5px rgba(47,227,154,0); }
    }

    @keyframes livePulseActive {
      0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(255,138,36,0.9); }
      50% { opacity: 0.8; box-shadow: 0 0 0 6px rgba(255,138,36,0); }
    }

    /* Day 52 Fix: NEW CHAT button glow when 2+ consec errors (context contamination prevention) */
    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 8px rgba(255,107,53,0.4); }
      50% { box-shadow: 0 0 18px rgba(255,107,53,0.9); }
    }

    .header-agent {
      font-family: var(--mono);
      font-size: 0.82rem;
      color: var(--green);
    }

    .header-model {
      font-family: var(--mono);
      font-size: 0.68rem;
      color: var(--text-dim);
      margin-left: auto;
    }

    /* ===========================
       MESSAGES
    =========================== */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.125rem;
    }

    /* Empty state */
    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      text-align: center;
      padding: 2rem;
    }

    .empty-logo {
      font-family: var(--display);
      font-size: 1.75rem;
      font-weight: 900;
      color: var(--orange);
      letter-spacing: 0.2em;
    }

    .empty-sub {
      font-family: var(--mono);
      font-size: 0.72rem;
      color: var(--text-dim);
      letter-spacing: 0.12em;
    }

    .hint-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      justify-content: center;
      margin-top: 1.25rem;
      max-width: 520px;
    }

    .hint-chip {
      padding: 0.5rem 0.875rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.8rem;
      color: var(--text-dim);
      background: var(--bg-1);
      cursor: pointer;
      transition: all 0.2s;
    }

    .hint-chip:hover {
      border-color: var(--orange);
      color: var(--orange);
      background: var(--orange-dim);
    }

    /* Message bubbles */
    .msg-row {
      display: flex;
      gap: 0.625rem;
      max-width: 82%;
    }

    .msg-row.user { align-self: flex-end; flex-direction: row-reverse; }
    .msg-row.assistant { align-self: flex-start; }

    .msg-avatar {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--mono);
      font-size: 0.6rem;
      font-weight: 500;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .msg-row.user .msg-avatar {
      background: var(--orange-dim);
      border: 1px solid var(--orange-border);
      color: var(--orange);
    }

    .msg-row.assistant .msg-avatar {
      background: var(--green-dim);
      border: 1px solid var(--green-border);
      color: var(--green);
    }

    .msg-bubble {
      padding: 0.7rem 0.975rem;
      border-radius: 10px;
      font-size: 0.875rem;
      line-height: 1.65;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .msg-row.user .msg-bubble {
      background: var(--orange-dim);
      border: 1px solid rgba(255, 138, 36, 0.25);
      border-top-right-radius: 3px;
    }

    .msg-row.assistant .msg-bubble {
      background: var(--bg-2);
      border: 1px solid var(--border);
      border-top-left-radius: 3px;
    }

    .msg-bubble.streaming:not(:empty)::after {
      content: '▋';
      color: var(--green);
      animation: blink 0.9s step-end infinite;
      margin-left: 2px;
    }

    .msg-bubble.error-bubble { color: #ff6b6b; }

    /* Day 36 — Thinking indicator (visible while waiting for first chunk) */
    .thinking-indicator {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.7rem 0.975rem;
      background: var(--bg-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      border-top-left-radius: 3px;
      font-size: 0.8rem;
      color: var(--text-dim);
      font-family: var(--mono);
      letter-spacing: 0.05em;
    }
    .thinking-indicator .dots {
      display: inline-flex;
      gap: 3px;
    }
    .thinking-indicator .dots span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--green);
      animation: thinking-bounce 1.2s infinite ease-in-out;
    }
    .thinking-indicator .dots span:nth-child(2) { animation-delay: 0.15s; }
    .thinking-indicator .dots span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes thinking-bounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
      30% { transform: translateY(-4px); opacity: 1; }
    }
    .thinking-elapsed {
      color: var(--text-faint, var(--text-dim));
      font-size: 0.7rem;
      opacity: 0.8;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* Tool calls badge */
    .tool-badge {
      display: inline-block;
      margin-top: 0.4rem;
      padding: 0.2rem 0.5rem;
      background: rgba(47, 227, 154, 0.1);
      border: 1px solid var(--green-border);
      border-radius: 4px;
      font-family: var(--mono);
      font-size: 0.62rem;
      color: var(--green);
      letter-spacing: 0.06em;
    }

    /* ===========================
       INPUT AREA
    =========================== */
    .input-area {
      padding: 0.875rem 1.5rem;
      border-top: 1px solid var(--border);
      background: var(--bg-1);
    }

    .input-row {
      display: flex;
      gap: 0.625rem;
      align-items: flex-end;
    }

    .chat-input {
      flex: 1;
      min-height: 44px;
      max-height: 160px;
      padding: 0.625rem 0.975rem;
      background: var(--bg-2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: var(--sans);
      font-size: 0.875rem;
      resize: none;
      outline: none;
      transition: border-color 0.2s;
      overflow-y: auto;
      line-height: 1.5;
    }

    .chat-input:focus { border-color: var(--orange); }
    .chat-input::placeholder { color: var(--text-dim); }
    .chat-input:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Day 40 — pulsing red dot for mic recording indicator */
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50%      { transform: scale(1.3); opacity: 0.5; }
    }

    .btn-action {
      width: 44px;
      height: 44px;
      border-radius: var(--radius);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.2s;
    }

    .btn-action.send {
      background: var(--orange);
    }

    .btn-action.send:hover:not(:disabled) {
      background: #ff9c40;
      transform: scale(1.05);
    }

    .btn-action.send:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      transform: none;
    }

    .btn-action.stop {
      background: rgba(255, 85, 85, 0.15);
      border: 1px solid rgba(255, 85, 85, 0.4);
    }

    .btn-action.stop:hover { background: rgba(255, 85, 85, 0.25); }

    .input-hint {
      font-family: var(--mono);
      font-size: 0.62rem;
      color: var(--text-dim);
      margin-top: 0.35rem;
      letter-spacing: 0.04em;
    }

    /* ===========================
       INIT / LOADING SCREEN
    =========================== */
    .center-screen {
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 2px solid var(--border);
      border-top-color: var(--orange);
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-label {
      font-family: var(--mono);

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js', { scope: '/' })
        .then((reg) => {
          // Check for updates every 60min while tab is open
          setInterval(() => reg.update().catch(() => {}), 60 * 60 * 1000);
          // When new SW takes over, soft-reload to pick up new assets
          reg.addEventListener('updatefound', () => {
            const newSw = reg.installing;
            if (!newSw) return;
            newSw.addEventListener('statechange', () => {
              if (newSw.state === 'installed' && navigator.serviceWorker.controller) {
                console.info('[SW] Update available — will activate on next navigation');
              }
            });
          });
        })
        .catch((err) => console.warn('[SW] register failed:', err));
    });
  }
