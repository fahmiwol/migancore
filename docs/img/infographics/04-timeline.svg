<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="2210" viewBox="0 0 1200 2210" role="img" aria-labelledby="title desc"><title id="title">One month, 12 decisions (29 Aug – 28 Sep 2026)</title><desc id="desc">Twelve dated decisions; the final decision stopped the remaining experiment before lock.</desc><style>text{font-family:Inter,"Segoe UI",system-ui,-apple-system,sans-serif} .mono{font-family:"JetBrains Mono",ui-monospace,Consolas,monospace}</style><rect x="0" y="0" width="1200" height="2210" fill="#050d0a"/><text x="56" y="49" font-size="13" fill="#2fe39a" letter-spacing="2">MIGANCORE / OPEN LAB NOTEBOOK</text><text x="56" y="104" font-size="34" fill="#edf7f2" >One month, 12 decisions (29 Aug – 28 Sep 2026)</text><text x="56" y="152" font-size="18" fill="#a8bbb2" >Decisions changed when evidence changed. The record preserves both.</text><line x1="248" y1="215" x2="248" y2="2017" stroke="#47d69933" stroke-width="2"/><circle cx="248" cy="224" r="5" fill="#d9bd59"/><text x="56" y="229" font-size="14" fill="#a8bbb2" >2026-08-29/30</text><text x="300" y="230" font-size="22" fill="#edf7f2" >Honesty path installed; a promotion revoked</text><text x="300" y="289" font-size="17" fill="#a8bbb2" >Honesty and contrast paths installed; the early promotion of 0.15-tool revoked after</text><text x="300" y="314" font-size="17" fill="#a8bbb2" >regression failure.</text><circle cx="248" cy="383" r="5" fill="#d9bd59"/><text x="56" y="388" font-size="14" fill="#a8bbb2" >2026-08-31</text><text x="300" y="389" font-size="22" fill="#edf7f2" >Training candidates stall</text><text x="300" y="448" font-size="17" fill="#a8bbb2" >V16-JUJUR did not win; MO-GRPO adapters remained unmeasured and the RLVR merge lost its</text><text x="300" y="473" font-size="17" fill="#a8bbb2" >budget.</text><circle cx="248" cy="542" r="5" fill="#d9bd59"/><text x="56" y="547" font-size="14" fill="#a8bbb2" >2026-09-01/02</text><text x="300" y="548" font-size="22" fill="#edf7f2" >Architecture locked; a dedicated measurement machine</text><text x="300" y="607" font-size="17" fill="#a8bbb2" >A canonical architecture and public instrument; a dedicated machine became the</text><text x="300" y="632" font-size="17" fill="#a8bbb2" >measurement authority.</text><circle cx="248" cy="701" r="5" fill="#d9bd59"/><text x="56" y="706" font-size="14" fill="#a8bbb2" >2026-09-02/03</text><text x="300" y="707" font-size="22" fill="#edf7f2" >A trap gate in serving</text><text x="300" y="766" font-size="17" fill="#a8bbb2" >GERBANG-JEBAKAN: A1 passed, A3 failed, A3b passed. The trap gate entered the serving</text><text x="300" y="791" font-size="17" fill="#a8bbb2" >path.</text><circle cx="248" cy="860" r="5" fill="#d9bd59"/><text x="56" y="865" font-size="14" fill="#a8bbb2" >2026-09-04 to 09-11</text><text x="300" y="866" font-size="22" fill="#edf7f2" >Retrieval and dictionary experiments</text><text x="300" y="925" font-size="17" fill="#a8bbb2" >Retrieval failed; one prompt test had impossible criteria; its replacement did not win.</text><text x="300" y="950" font-size="17" fill="#a8bbb2" >H4-KAMUS accepted.</text><circle cx="248" cy="1019" r="5" fill="#d9bd59"/><text x="56" y="1024" font-size="14" fill="#a8bbb2" >2026-09-15/16</text><text x="300" y="1025" font-size="22" fill="#edf7f2" >An anchor, and a hypothesis that did not hold</text><text x="300" y="1084" font-size="17" fill="#a8bbb2" >A3 completed; its base was later identified as Thinking, not Instruct. H-RAGU remained</text><text x="300" y="1109" font-size="17" fill="#a8bbb2" >inconclusive.</text><circle cx="248" cy="1178" r="5" fill="#d9bd59"/><text x="56" y="1183" font-size="14" fill="#a8bbb2" >2026-09-16/18</text><text x="300" y="1184" font-size="22" fill="#edf7f2" >Housekeeping: one source of truth</text><text x="300" y="1243" font-size="17" fill="#a8bbb2" >The predecessor closed; the model lineage was reconstructed and Studio drew from</text><text x="300" y="1268" font-size="17" fill="#a8bbb2" >canonical sources.</text><circle cx="248" cy="1337" r="5" fill="#d9bd59"/><text x="56" y="1342" font-size="14" fill="#a8bbb2" >2026-09-20/21</text><text x="300" y="1343" font-size="22" fill="#edf7f2" >Gate ON, law C61, a new direction</text><text x="300" y="1402" font-size="17" fill="#a8bbb2" >GERBANG-ON passed with fact accuracy preserved; C61 tied gate benefit to base</text><text x="300" y="1427" font-size="17" fill="#a8bbb2" >fabrication.</text><circle cx="248" cy="1496" r="5" fill="#d9bd59"/><text x="56" y="1501" font-size="14" fill="#a8bbb2" >2026-09-23</text><text x="300" y="1502" font-size="22" fill="#edf7f2" >A boundary paragraph works; latency does not</text><text x="300" y="1561" font-size="17" fill="#a8bbb2" >The boundary paragraph reduced out-of-scope fabrication. The model failed the latency</text><text x="300" y="1586" font-size="17" fill="#a8bbb2" >criterion.</text><circle cx="248" cy="1655" r="5" fill="#d9bd59"/><text x="56" y="1660" font-size="14" fill="#a8bbb2" >2026-09-25/26</text><text x="300" y="1661" font-size="22" fill="#edf7f2" >Weights versus base</text><text x="300" y="1720" font-size="17" fill="#a8bbb2" >The base fabricated less, but the anti-evasion guard failed: no honesty claim is made.</text><text x="300" y="1745" font-size="17" fill="#a8bbb2" >SB1 kept the base.</text><circle cx="248" cy="1814" r="5" fill="#d9bd59"/><text x="56" y="1819" font-size="14" fill="#a8bbb2" >2026-09-27</text><text x="300" y="1820" font-size="22" fill="#edf7f2" >The generative own-model track closes</text><text x="300" y="1879" font-size="17" fill="#a8bbb2" >Own-model generative training stopped. Gerbang-S1 became the remaining bet; D1 paused,</text><text x="300" y="1904" font-size="17" fill="#a8bbb2" >H-ALUR stopped.</text><rect x="276" y="1944" width="868" height="144" rx="8" fill="#0d1f1a" stroke="#b58aff"/><circle cx="248" cy="1973" r="8" fill="#b58aff"/><text x="56" y="1978" font-size="14" fill="#a8bbb2" >2026-09-28</text><text x="300" y="1979" font-size="22" fill="#b58aff" >Stopped before lock → project closed</text><text x="300" y="2038" font-size="17" fill="#a8bbb2" >Gerbang-S1 stopped before lock under the probability rule. The project closed; nothing</text><text x="300" y="2063" font-size="17" fill="#a8bbb2" >was deleted.</text><line x1="56" y1="2138" x2="1144" y2="2138" stroke="#47d69933" /><text x="56" y="2172" font-size="12" fill="#a8bbb2" >MiganCore open release · source: timeline.en.json → events</text></svg>