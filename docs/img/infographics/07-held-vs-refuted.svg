<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1540" viewBox="0 0 1200 1540" role="img" aria-labelledby="title desc"><title id="title">What held. What did not hold.</title><desc id="desc">Measured outcomes side by side. The failed anti-evasion guard prevents an honesty claim.</desc><style>text{font-family:Inter,"Segoe UI",system-ui,-apple-system,sans-serif} .mono{font-family:"JetBrains Mono",ui-monospace,Consolas,monospace}</style><rect x="0" y="0" width="1200" height="1540" fill="#050d0a"/><text x="56" y="49" font-size="13" fill="#2fe39a" letter-spacing="2">MIGANCORE / OPEN LAB NOTEBOOK</text><text x="56" y="104" font-size="34" fill="#edf7f2" >What held. What did not hold.</text><text x="56" y="151" font-size="18" fill="#a8bbb2" >Successes and failures are evidence under their stated conditions.</text><text x="56" y="215" font-size="27" fill="#2fe39a" >What held (measured)</text><text x="620" y="215" font-size="27" fill="#ff8f85" >What did not hold (measured)</text><rect x="56" y="248" width="524" height="207" rx="8" fill="#0d1f1a" /><line x1="80" y1="248" x2="556" y2="248" stroke="#2fe39a" stroke-width="2"/><text x="80" y="285" font-size="20" fill="#edf7f2" >Boundary paragraph</text><text x="80" y="333" font-size="28" fill="#2fe39a" class="mono">28.9 → 8.9 %</text><text x="80" y="369" font-size="17" fill="#a8bbb2" >Out-of-scope fabrication; p95 latency 1.04 s.</text><text x="80" y="394" font-size="17" fill="#a8bbb2" >Over-refusal 3.3 %.</text><rect x="56" y="477" width="524" height="207" rx="8" fill="#0d1f1a" /><line x1="80" y1="477" x2="556" y2="477" stroke="#2fe39a" stroke-width="2"/><text x="80" y="514" font-size="20" fill="#edf7f2" >Abstention gate</text><text x="80" y="562" font-size="28" fill="#2fe39a" class="mono">52.2 → 33.9 %</text><text x="80" y="598" font-size="17" fill="#a8bbb2" >Fabrication; over-refusal 1.6 %. Fact accuracy not</text><text x="80" y="623" font-size="17" fill="#a8bbb2" >reduced.</text><rect x="56" y="706" width="524" height="207" rx="8" fill="#0d1f1a" /><line x1="80" y1="706" x2="556" y2="706" stroke="#2fe39a" stroke-width="2"/><text x="80" y="743" font-size="20" fill="#edf7f2" >Law C61</text><text x="80" y="791" font-size="28" fill="#2fe39a" class="mono">r = +0.942</text><text x="80" y="827" font-size="17" fill="#a8bbb2" >The gate helps in proportion to base fabrication.</text><rect x="56" y="935" width="524" height="207" rx="8" fill="#0d1f1a" /><line x1="80" y1="935" x2="556" y2="935" stroke="#2fe39a" stroke-width="2"/><text x="80" y="972" font-size="20" fill="#edf7f2" >Pre-registration discipline</text><text x="80" y="1020" font-size="28" fill="#2fe39a" class="mono">39 experiments</text><text x="80" y="1056" font-size="17" fill="#a8bbb2" >Locked before data: the research method, including</text><text x="80" y="1081" font-size="17" fill="#a8bbb2" >its recorded exceptions.</text><rect x="56" y="1164" width="524" height="207" rx="8" fill="#0d1f1a" /><line x1="80" y1="1164" x2="556" y2="1164" stroke="#2fe39a" stroke-width="2"/><text x="80" y="1201" font-size="20" fill="#edf7f2" >Instrument self-audit</text><text x="80" y="1249" font-size="28" fill="#2fe39a" class="mono">20 found · 19 guarded</text><text x="80" y="1285" font-size="17" fill="#a8bbb2" >Defect classes found in our own instruments;</text><text x="80" y="1310" font-size="17" fill="#a8bbb2" >automated guards for 19.</text><rect x="620" y="248" width="524" height="207" rx="8" fill="#0d1f1a" /><line x1="644" y1="248" x2="1120" y2="248" stroke="#ff8f85" stroke-width="2"/><text x="644" y="285" font-size="20" fill="#edf7f2" >Training to be more honest</text><text x="644" y="333" font-size="28" fill="#ff8f85" class="mono">60.0 % vs ≤ 50 %</text><text x="644" y="369" font-size="17" fill="#a8bbb2" >V16-JUJUR did not meet its win threshold.</text><rect x="620" y="477" width="524" height="207" rx="8" fill="#0d1f1a" /><line x1="644" y1="477" x2="1120" y2="477" stroke="#d9bd59" stroke-width="2"/><text x="644" y="514" font-size="20" fill="#edf7f2" >Hesitation as a knowledge signal</text><text x="644" y="562" font-size="28" fill="#d9bd59" class="mono">H-RAGU · inconclusive</text><text x="644" y="598" font-size="17" fill="#a8bbb2" >Hesitation was not established as a knowledge</text><text x="644" y="623" font-size="17" fill="#a8bbb2" >signal.</text><rect x="620" y="706" width="524" height="207" rx="8" fill="#0d1f1a" /><line x1="644" y1="706" x2="1120" y2="706" stroke="#ff8f85" stroke-width="2"/><text x="644" y="743" font-size="20" fill="#edf7f2" >Latency for game characters</text><text x="644" y="791" font-size="28" fill="#ff8f85" class="mono">p95 6.73 s</text><text x="644" y="827" font-size="17" fill="#a8bbb2" >E1 failed its model latency criterion.</text><rect x="620" y="935" width="524" height="207" rx="8" fill="#0d1f1a" /><line x1="644" y1="935" x2="1120" y2="935" stroke="#d9bd59" stroke-width="2"/><text x="644" y="972" font-size="20" fill="#edf7f2" >Fine-tune versus base</text><text x="644" y="1020" font-size="28" fill="#d9bd59" class="mono">A3I-ULANG</text><text x="644" y="1056" font-size="17" fill="#a8bbb2" >on A3I-ULANG 0.14 fabricated 53.7 % vs 14.7 % for</text><text x="644" y="1081" font-size="17" fill="#a8bbb2" >the base, but the anti-evasion guard failed, so no</text><text x="644" y="1106" font-size="17" fill="#a8bbb2" >honesty claim is made.</text><rect x="620" y="1164" width="524" height="207" rx="8" fill="#0d1f1a" /><line x1="644" y1="1164" x2="1120" y2="1164" stroke="#d9bd59" stroke-width="2"/><text x="644" y="1201" font-size="20" fill="#edf7f2" >The final bet</text><text x="644" y="1249" font-size="28" fill="#d9bd59" class="mono">P(win) ≈ 0.20–0.35</text><text x="644" y="1285" font-size="17" fill="#a8bbb2" >Gerbang-S1 stopped before lock, below the owner’s</text><text x="644" y="1310" font-size="17" fill="#a8bbb2" >0.80 rule.</text><line x1="56" y1="1468" x2="1144" y2="1468" stroke="#47d69933" /><text x="56" y="1447" font-size="16" fill="#edf7f2" >The register includes unlocked and never-run entries; 39 is the register total.</text><text x="56" y="1502" font-size="12" fill="#a8bbb2" >MiganCore open release · source: BRIEF.md → held-vs-refuted; migancore-public.en.json → counts, preRegistrations</text></svg>