<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1140" viewBox="0 0 1200 1140" role="img" aria-labelledby="title desc"><title id="title">MiganCore at a glance (May–Sep 2026)</title><desc id="desc">Research counts, closure status, and two measured interventions that required no training.</desc><style>text{font-family:Inter,"Segoe UI",system-ui,-apple-system,sans-serif} .mono{font-family:"JetBrains Mono",ui-monospace,Consolas,monospace}</style><rect x="0" y="0" width="1200" height="1140" fill="#050d0a"/><text x="56" y="49" font-size="13" fill="#2fe39a" letter-spacing="2">MIGANCORE / OPEN LAB NOTEBOOK</text><text x="56" y="104" font-size="34" fill="#edf7f2" >MiganCore at a glance (May–Sep 2026)</text><text x="56" y="148" font-size="18" fill="#a8bbb2" >A closed research project on small models, Indonesian, and the boundary of knowledge.</text><rect x="56" y="190" width="260" height="160" rx="8" fill="#0d1f1a" /><text x="78" y="259" font-size="51" fill="#edf7f2" class="mono">41</text><text x="78" y="313" font-size="16" fill="#a8bbb2" >model variants</text><rect x="332" y="190" width="260" height="160" rx="8" fill="#0d1f1a" /><text x="354" y="259" font-size="51" fill="#edf7f2" class="mono">39</text><text x="354" y="313" font-size="16" fill="#a8bbb2" >pre-registered experiments</text><rect x="608" y="190" width="260" height="160" rx="8" fill="#0d1f1a" /><text x="630" y="259" font-size="51" fill="#edf7f2" class="mono">316</text><text x="630" y="313" font-size="16" fill="#a8bbb2" >findings</text><rect x="884" y="190" width="260" height="160" rx="8" fill="#0d1f1a" /><text x="906" y="259" font-size="51" fill="#edf7f2" class="mono">35</text><text x="906" y="313" font-size="16" fill="#a8bbb2" >laws</text><rect x="56" y="374" width="1088" height="88" rx="8" fill="#0d1f1a" /><text x="80" y="409" font-size="20" fill="#edf7f2" class="mono">10 pass  ·  6 fail  ·  16 neutral  ·  7 never run</text><text x="80" y="438" font-size="16" fill="#a8bbb2" >Every outcome stays in the record.</text><rect x="56" y="486" width="530" height="193" rx="8" fill="#0d1f1a" /><text x="80" y="526" font-size="12" fill="#a8bbb2" letter-spacing="1.6">INSTRUMENTS, UNDER SCRUTINY</text><text x="80" y="580" font-size="32" fill="#edf7f2" >20 defect classes</text><text x="80" y="623" font-size="20" fill="#2fe39a" >19 guarded by automated checks</text><rect x="610" y="486" width="534" height="193" rx="8" fill="#0d1f1a" /><text x="634" y="526" font-size="12" fill="#a8bbb2" letter-spacing="1.6">STATE AT CLOSURE</text><text x="634" y="563" font-size="24" fill="#2fe39a" class="mono">migancore:0.14 · served</text><text x="634" y="599" font-size="17" fill="#a8bbb2" class="mono">Since 2026-08-24</text><text x="634" y="637" font-size="17" fill="#a8bbb2" >Closed 2026-09-28 · nothing deleted</text><text x="56" y="737" font-size="27" fill="#edf7f2" >Two layers that worked without any training</text><rect x="56" y="768" width="532" height="202" rx="8" fill="#0d1f1a" /><line x1="80" y1="768" x2="564" y2="768" stroke="#2fe39a" stroke-width="2"/><text x="80" y="810" font-size="21" fill="#edf7f2" >Boundary paragraph</text><text x="80" y="866" font-size="34" fill="#2fe39a" class="mono">28.9 % → 8.9 %</text><text x="80" y="910" font-size="17" fill="#a8bbb2" >Out-of-scope fabrication</text><text x="80" y="943" font-size="14" fill="#a8bbb2" >Over-refusal 3.3 % · p95 latency 1.04 s</text><rect x="612" y="768" width="532" height="202" rx="8" fill="#0d1f1a" /><line x1="636" y1="768" x2="1120" y2="768" stroke="#2fe39a" stroke-width="2"/><text x="636" y="810" font-size="21" fill="#edf7f2" >Abstention gate</text><text x="636" y="866" font-size="34" fill="#2fe39a" class="mono">52.2 % → 33.9 %</text><text x="636" y="910" font-size="17" fill="#a8bbb2" >Fabrication; fact accuracy not reduced</text><text x="636" y="943" font-size="14" fill="#a8bbb2" >Over-refusal 1.6 %</text><text x="56" y="1023" font-size="20" fill="#a8bbb2" >MAKSARA · the planned successor</text><text x="1144" y="1023" font-size="24" fill="#b58aff" text-anchor="end">NOT BORN</text><line x1="56" y1="1068" x2="1144" y2="1068" stroke="#47d69933" /><text x="56" y="1102" font-size="12" fill="#a8bbb2" >MiganCore open release · source: migancore-public.en.json → counts, servedModel, birth; BRIEF.md → at-a-glance</text></svg>