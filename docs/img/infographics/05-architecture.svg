<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1923" viewBox="0 0 1200 1923" role="img" aria-labelledby="title desc"><title id="title">How MiganCore was built</title><desc id="desc">Seven layers, with policy and machines as side rails. Planned and stopped work is labeled explicitly.</desc><style>text{font-family:Inter,"Segoe UI",system-ui,-apple-system,sans-serif} .mono{font-family:"JetBrains Mono",ui-monospace,Consolas,monospace}</style><rect x="0" y="0" width="1200" height="1923" fill="#050d0a"/><text x="56" y="49" font-size="13" fill="#2fe39a" letter-spacing="2">MIGANCORE / OPEN LAB NOTEBOOK</text><text x="56" y="104" font-size="34" fill="#edf7f2" >How MiganCore was built</text><text x="56" y="151" font-size="18" fill="#a8bbb2" >A research system whose verdicts return to the same source as its hypotheses.</text><rect x="264" y="200" width="672" height="175" rx="8" fill="#0d1f1a" /><text x="288" y="231" font-size="12" fill="#a8bbb2" letter-spacing="1.5">LENS</text><text x="288" y="267" font-size="24" fill="#edf7f2" >MiganCore Studio</text><text x="288" y="301" font-size="17" fill="#a8bbb2" >2D and 3D worlds over one data snapshot, generated from a registry</text><text x="288" y="326" font-size="17" fill="#a8bbb2" >of canonical sources. Facts older than 7 days are marked stale.</text><line x1="600" y1="375" x2="600" y2="399" stroke="#2fe39a" /><path d="M595 393 l5 6 l5 -6" fill="none" stroke="#2fe39a"/><rect x="264" y="399" width="672" height="285" rx="8" fill="#0d1f1a" /><text x="288" y="430" font-size="12" fill="#a8bbb2" letter-spacing="1.5">PRE-REGISTRATION LOOP</text><text x="288" y="466" font-size="24" fill="#edf7f2" >Lock the decision before the data</text><text x="288" y="500" font-size="17" fill="#a8bbb2" >Hypothesis with two ways to be wrong → thresholds checked for</text><text x="288" y="525" font-size="17" fill="#a8bbb2" >win-ability → probabilistic forecasts → git lock → adversarial</text><text x="288" y="550" font-size="17" fill="#a8bbb2" >review (amendments may only tighten) → run on the measurement</text><text x="288" y="575" font-size="17" fill="#a8bbb2" >machine → verdict tool reads the thresholds from the file →</text><text x="288" y="600" font-size="17" fill="#a8bbb2" >verdict written back into the same file.</text><line x1="600" y1="684" x2="600" y2="708" stroke="#2fe39a" /><path d="M595 702 l5 6 l5 -6" fill="none" stroke="#2fe39a"/><rect x="264" y="708" width="672" height="240" rx="8" fill="#0d1f1a" /><text x="288" y="739" font-size="12" fill="#a8bbb2" letter-spacing="1.5">MEASUREMENT</text><text x="288" y="775" font-size="24" fill="#edf7f2" >Measure the model and the instrument</text><text x="288" y="809" font-size="17" fill="#a8bbb2" >petak-jujur2 (36 questions), petak-40, A3 anchor. At least 5</text><text x="288" y="834" font-size="17" fill="#a8bbb2" >rounds; 95 % CIs; paired fabrication, over-refusal and fact</text><text x="288" y="859" font-size="17" fill="#a8bbb2" >accuracy. Models pinned by fingerprint, not tag name.</text><text x="288" y="884" font-size="17" fill="#a8bbb2" >Mutation-tested verdict tools and automated guards.</text><line x1="600" y1="948" x2="600" y2="972" stroke="#2fe39a" /><path d="M595 966 l5 6 l5 -6" fill="none" stroke="#2fe39a"/><rect x="264" y="972" width="672" height="225" rx="8" fill="#0d1f1a" /><text x="288" y="1003" font-size="12" fill="#2fe39a" letter-spacing="1.5">PATH LAYER</text><text x="288" y="1039" font-size="24" fill="#edf7f2" >What worked without training</text><text x="288" y="1073" font-size="17" fill="#a8bbb2" >Abstention gate (probe / NLI entailment), boundary paragraph in</text><text x="288" y="1098" font-size="17" fill="#a8bbb2" >the persona, retrieval per intent, routing. Planned but stopped:</text><text x="288" y="1123" font-size="17" fill="#a8bbb2" >Gerbang-S1, a small decision encoder in front of any LLM.</text><line x1="600" y1="1197" x2="600" y2="1221" stroke="#2fe39a" /><path d="M595 1215 l5 6 l5 -6" fill="none" stroke="#2fe39a"/><rect x="264" y="1221" width="672" height="170" rx="8" fill="#0d1f1a" /><text x="288" y="1252" font-size="12" fill="#a8bbb2" letter-spacing="1.5">SERVING</text><text x="288" y="1288" font-size="24" fill="#edf7f2" >Sovereign inference</text><text x="288" y="1322" font-size="17" fill="#a8bbb2" >Ollama on CPU and an MCP server (ask / compare / status). No</text><text x="288" y="1347" font-size="17" fill="#a8bbb2" >routing to external models while serving.</text><line x1="600" y1="1391" x2="600" y2="1415" stroke="#2fe39a" /><path d="M595 1409 l5 6 l5 -6" fill="none" stroke="#2fe39a"/><rect x="264" y="1415" width="672" height="200" rx="8" fill="#0d1f1a" /><text x="288" y="1446" font-size="12" fill="#a8bbb2" letter-spacing="1.5">TRAINING</text><text x="288" y="1482" font-size="24" fill="#edf7f2" >Adapters, merges, model artifacts</text><text x="288" y="1516" font-size="17" fill="#a8bbb2" >LoRA SFT / DPO and TIES merges on rented GPUs → GGUF (Q4) → Ollama</text><text x="288" y="1541" font-size="17" fill="#a8bbb2" >tags. From 18 Sep every training row carries its teacher of</text><text x="288" y="1566" font-size="17" fill="#a8bbb2" >origin.</text><line x1="600" y1="1615" x2="600" y2="1639" stroke="#2fe39a" /><path d="M595 1633 l5 6 l5 -6" fill="none" stroke="#2fe39a"/><rect x="264" y="1639" width="672" height="150" rx="8" fill="#0d1f1a" /><text x="288" y="1670" font-size="12" fill="#a8bbb2" letter-spacing="1.5">BASE WEIGHTS</text><text x="288" y="1706" font-size="24" fill="#edf7f2" >Qwen3-4B-Instruct-2507</text><text x="288" y="1740" font-size="17" fill="#a8bbb2" >Apache-2.0. Earlier: a Qwen2.5-7B line and Qwen3-8B experiments.</text><rect x="56" y="200" width="184" height="1589" rx="8" fill="#0d1f1a" /><text x="76" y="237" font-size="14" fill="#d9bd59" letter-spacing="2">POLICY</text><text x="76" y="278" font-size="20" fill="#edf7f2" >Teacher policy</text><text x="76" y="354" font-size="16" fill="#a8bbb2" >From 18 Sep:</text><text x="76" y="379" font-size="16" fill="#a8bbb2" >only teachers</text><text x="76" y="404" font-size="16" fill="#a8bbb2" >whose terms</text><text x="76" y="429" font-size="16" fill="#a8bbb2" >allow</text><text x="76" y="454" font-size="16" fill="#a8bbb2" >distillation</text><text x="76" y="479" font-size="16" fill="#a8bbb2" >(e.g. DeepSeek)</text><text x="76" y="504" font-size="16" fill="#a8bbb2" >or permissive</text><text x="76" y="529" font-size="16" fill="#a8bbb2" >open models.</text><text x="76" y="554" font-size="16" fill="#a8bbb2" >Outputs of</text><text x="76" y="579" font-size="16" fill="#a8bbb2" >services whose</text><text x="76" y="604" font-size="16" fill="#a8bbb2" >terms forbid it</text><text x="76" y="629" font-size="16" fill="#a8bbb2" >are never</text><text x="76" y="654" font-size="16" fill="#a8bbb2" >training data.</text><line x1="76" y1="654" x2="220" y2="654" stroke="#47d69933" /><text x="76" y="699" font-size="17" fill="#edf7f2" >Data never</text><text x="76" y="726" font-size="17" fill="#edf7f2" >leaves. Teachers</text><text x="76" y="753" font-size="17" fill="#edf7f2" >offline only.</text><rect x="960" y="200" width="184" height="1589" rx="8" fill="#0d1f1a" /><text x="980" y="237" font-size="14" fill="#d9bd59" letter-spacing="2">MACHINES</text><text x="980" y="290" font-size="20" fill="#edf7f2" >Laptop</text><text x="980" y="327" font-size="16" fill="#a8bbb2" >Work and</text><text x="980" y="352" font-size="16" fill="#a8bbb2" >canonical repo</text><text x="980" y="475" font-size="20" fill="#edf7f2" >Measurement</text><text x="980" y="503" font-size="20" fill="#edf7f2" >machine</text><text x="980" y="550" font-size="16" fill="#a8bbb2" >CPU Ollama and</text><text x="980" y="575" font-size="16" fill="#a8bbb2" >model store</text><text x="980" y="700" font-size="20" fill="#edf7f2" >VPS</text><text x="980" y="738" font-size="16" fill="#a8bbb2" >Live serving</text><line x1="56" y1="1851" x2="1144" y2="1851" stroke="#47d69933" /><text x="56" y="1885" font-size="12" fill="#a8bbb2" >MiganCore open release · source: BRIEF.md → architecture</text></svg>