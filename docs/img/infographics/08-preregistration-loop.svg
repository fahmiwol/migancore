<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1510" viewBox="0 0 1200 1510" role="img" aria-labelledby="title desc"><title id="title">The pre-registration loop</title><desc id="desc">A clockwise ten-step cycle. Hypotheses and criteria are locked before a run; verdicts return to the canonical source.</desc><style>text{font-family:Inter,"Segoe UI",system-ui,-apple-system,sans-serif} .mono{font-family:"JetBrains Mono",ui-monospace,Consolas,monospace}</style><rect x="0" y="0" width="1200" height="1510" fill="#050d0a"/><text x="56" y="49" font-size="13" fill="#2fe39a" letter-spacing="2">MIGANCORE / OPEN LAB NOTEBOOK</text><text x="56" y="104" font-size="34" fill="#edf7f2" >The pre-registration loop</text><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2fe39a"/></marker></defs><text x="56" y="151" font-size="18" fill="#a8bbb2" >Decide what evidence would matter before seeing the result.</text><path d="M716 332.7161093980861 Q737.8139876645555 321.5816491410756 748.5033635316129 344.68522347069074" fill="none" stroke="#a8bbb2" stroke-width="2" marker-end="url(#arrow)"/><rect x="490" y="249" width="220" height="82" rx="8" fill="#0d1f1a" /><text x="600" y="281" font-size="18" fill="#edf7f2" text-anchor="middle">Hypothesis</text><text x="600" y="313" font-size="13" fill="#a8bbb2" text-anchor="middle">Two ways to be wrong</text><path d="M894.6335095459528 434.4013328687768 Q960.801703830965 504.32119832751226 997.8452863184791 595.4013328687768" fill="none" stroke="#a8bbb2" stroke-width="2" marker-end="url(#arrow)"/><rect x="754.5033635316129" y="346.4013328687768" width="220" height="82" rx="8" fill="#0d1f1a" /><text x="864.5033635316129" y="378.4013328687768" font-size="18" fill="#edf7f2" text-anchor="middle">Thresholds</text><text x="864.5033635316129" y="410.4013328687768" font-size="13" fill="#a8bbb2" text-anchor="middle">Win-ability check</text><path d="M1027.975432332819 689.4013328687768 Q1045.975432332819 800 1027.975432332819 910.5986671312232" fill="none" stroke="#a8bbb2" stroke-width="2" marker-end="url(#arrow)"/><rect x="917.9754323328191" y="601.4013328687768" width="220" height="82" rx="8" fill="#0d1f1a" /><text x="1027.975432332819" y="633.4013328687768" font-size="18" fill="#edf7f2" text-anchor="middle">Forecasts</text><text x="1027.975432332819" y="665.4013328687768" font-size="13" fill="#a8bbb2" text-anchor="middle">Probabilistic</text><path d="M997.8452863184791 1004.5986671312232 Q960.801703830965 1095.6788016724877 894.6335095459528 1165.5986671312232" fill="none" stroke="#a8bbb2" stroke-width="2" marker-end="url(#arrow)"/><rect x="917.9754323328191" y="916.5986671312232" width="220" height="82" rx="8" fill="#0d1f1a" /><text x="1027.975432332819" y="948.5986671312232" font-size="18" fill="#edf7f2" text-anchor="middle">Git lock</text><text x="1027.975432332819" y="980.5986671312232" font-size="13" fill="#a8bbb2" text-anchor="middle">Before the run</text><path d="M748.5033635316129 1255.3147765293093 Q737.8139876645555 1278.4183508589242 716 1267.283890601914" fill="none" stroke="#a8bbb2" stroke-width="2" marker-end="url(#arrow)"/><rect x="754.5033635316129" y="1171.5986671312232" width="220" height="82" rx="8" fill="#0d1f1a" /><text x="864.5033635316129" y="1203.5986671312232" font-size="18" fill="#edf7f2" text-anchor="middle">Adversarial review</text><text x="864.5033635316129" y="1235.5986671312232" font-size="13" fill="#a8bbb2" text-anchor="middle">Stricter only</text><path d="M484 1267.283890601914 Q462.1860123354445 1278.4183508589242 451.4966364683871 1255.3147765293093" fill="none" stroke="#a8bbb2" stroke-width="2" marker-end="url(#arrow)"/><rect x="490" y="1269" width="220" height="82" rx="8" fill="#0d1f1a" /><text x="600" y="1301" font-size="18" fill="#edf7f2" text-anchor="middle">Run</text><text x="600" y="1333" font-size="13" fill="#a8bbb2" text-anchor="middle">≥ 5 rounds; paired metrics</text><path d="M305.36649045404715 1165.5986671312232 Q239.19829616903496 1095.6788016724877 202.1547136815209 1004.5986671312232" fill="none" stroke="#a8bbb2" stroke-width="2" marker-end="url(#arrow)"/><rect x="225.49663646838712" y="1171.5986671312232" width="220" height="82" rx="8" fill="#0d1f1a" /><text x="335.4966364683871" y="1203.5986671312232" font-size="18" fill="#edf7f2" text-anchor="middle">Verdict tool</text><text x="335.4966364683871" y="1235.5986671312232" font-size="13" fill="#a8bbb2" text-anchor="middle">Read locked thresholds</text><path d="M172.02456766718092 910.5986671312232 Q154.0245676671809 800 172.02456766718086 689.4013328687769" fill="none" stroke="#a8bbb2" stroke-width="2" marker-end="url(#arrow)"/><rect x="62.02456766718092" y="916.5986671312232" width="220" height="82" rx="8" fill="#0d1f1a" /><text x="172.02456766718092" y="948.5986671312232" font-size="18" fill="#edf7f2" text-anchor="middle">Verdict written back</text><text x="172.02456766718092" y="980.5986671312232" font-size="13" fill="#a8bbb2" text-anchor="middle">Into the same file</text><path d="M202.15471368152083 595.4013328687769 Q239.1982961690349 504.3211983275124 305.3664904540471 434.4013328687769" fill="none" stroke="#a8bbb2" stroke-width="2" marker-end="url(#arrow)"/><rect x="62.02456766718086" y="601.4013328687769" width="220" height="82" rx="8" fill="#0d1f1a" /><text x="172.02456766718086" y="633.4013328687769" font-size="18" fill="#edf7f2" text-anchor="middle">Studio regenerates</text><text x="172.02456766718086" y="665.4013328687769" font-size="13" fill="#a8bbb2" text-anchor="middle">From canonical sources</text><path d="M451.49663646838707 344.68522347069074 Q462.1860123354444 321.5816491410757 483.9999999999999 332.71610939808613" fill="none" stroke="#a8bbb2" stroke-width="2" marker-end="url(#arrow)"/><rect x="225.49663646838707" y="346.4013328687769" width="220" height="82" rx="8" fill="#0d1f1a" /><text x="335.49663646838707" y="378.4013328687769" font-size="18" fill="#edf7f2" text-anchor="middle">Finding / law / skill</text><text x="335.49663646838707" y="410.4013328687769" font-size="13" fill="#a8bbb2" text-anchor="middle">Feed the next question</text><text x="600" y="759" font-size="27" fill="#edf7f2" text-anchor="middle">Ask what would change</text><text x="600" y="800" font-size="27" fill="#edf7f2" text-anchor="middle">your decision,</text><text x="600" y="849" font-size="31" fill="#2fe39a" text-anchor="middle">then lock it.</text><line x1="56" y1="1438" x2="1144" y2="1438" stroke="#47d69933" /><text x="56" y="1472" font-size="12" fill="#a8bbb2" >MiganCore open release · source: BRIEF.md → preregistration-loop</text></svg>