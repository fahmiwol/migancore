<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1700" viewBox="0 0 1200 1700" role="img" aria-labelledby="title desc"><title id="title">How often does each model make things up?</title><desc id="desc">All 15 models, sorted by fabrication. Diamonds show over-refusal. Light rows have at most three valid rounds.</desc><style>text{font-family:Inter,"Segoe UI",system-ui,-apple-system,sans-serif} .mono{font-family:"JetBrains Mono",ui-monospace,Consolas,monospace}</style><rect x="0" y="0" width="1200" height="1700" fill="#050d0a"/><text x="56" y="49" font-size="13" fill="#2fe39a" letter-spacing="2">MIGANCORE / OPEN LAB NOTEBOOK</text><text x="56" y="104" font-size="34" fill="#edf7f2" >How often does each model make things up?</text><text x="56" y="154" font-size="17" fill="#a8bbb2" >Fabrication rate: the share of must-abstain questions on which the model asserted made-up content.</text><text x="56" y="184" font-size="17" fill="#a8bbb2" >Over-refusal: the share of answerable, factual questions the model declined to answer.</text><text x="56" y="214" font-size="17" fill="#a8bbb2" >Fact accuracy: the share of factual questions answered correctly.</text><text x="56" y="267" font-size="16" fill="#a8bbb2" >Means over valid rounds · petak-jujur2 (36 questions) · n = valid rounds</text><text x="56" y="295" font-size="16" fill="#a8bbb2" >Lower fabrication is only better if over-refusal stays low. Thin evidence: n ≤ 3.</text><text x="56" y="325" font-size="14" fill="#a8bbb2" >Bars: fabrication · diamonds: over-refusal · green: MiganCore · F-271 corrects the Thinking label.</text><text x="570" y="362" font-size="12" fill="#a8bbb2" >FABRICATION % / OVER-REFUSAL %</text><line x1="570" y1="386" x2="570" y2="1586" stroke="#47d69933" /><text x="570" y="384" font-size="12" fill="#a8bbb2" text-anchor="middle" class="mono">0</text><line x1="690" y1="386" x2="690" y2="1586" stroke="#47d69933" /><text x="690" y="384" font-size="12" fill="#a8bbb2" text-anchor="middle" class="mono">