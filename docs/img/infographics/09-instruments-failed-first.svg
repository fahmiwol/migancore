<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1050" viewBox="0 0 1200 1050" role="img" aria-labelledby="title desc"><title id="title">Our own instruments failed before the models did</title><desc id="desc">Four instrument failures: denominator, verdict gate, client timeout, and health-check target.</desc><style>text{font-family:Inter,"Segoe UI",system-ui,-apple-system,sans-serif} .mono{font-family:"JetBrains Mono",ui-monospace,Consolas,monospace}</style><rect x="0" y="0" width="1200" height="1050" fill="#050d0a"/><text x="56" y="49" font-size="13" fill="#2fe39a" letter-spacing="2">MIGANCORE / OPEN LAB NOTEBOOK</text><text x="56" y="104" font-size="34" fill="#edf7f2" >Our own instruments failed before the models did</text><text x="56" y="151" font-size="18" fill="#a8bbb2" >The measurement system was itself a research subject.</text><rect x="56" y="213" width="532" height="310" rx="8" fill="#0d1f1a" /><text x="82" y="252" font-size="12" fill="#ff8f85" letter-spacing="1">C22 / DENOMINATOR</text><text x="82" y="317" font-size="35" fill="#edf7f2" class="mono">16/14 = 114 %</text><text x="82" y="370" font-size="22" fill="#edf7f2" >A ratio inflated every historical rate.</text><text x="82" y="460" font-size="16" fill="#a8bbb2" >A valid-looking percentage can still have the</text><text x="82" y="484" font-size="16" fill="#a8bbb2" >wrong denominator.</text><rect x="612" y="213" width="532" height="310" rx="8" fill="#0d1f1a" /><text x="638" y="252" font-size="12" fill="#ff8f85" letter-spacing="1">F-219 / VERDICT GATE</text><text x="638" y="317" font-size="35" fill="#edf7f2" class="mono">p = 1.0000</text><text x="638" y="370" font-size="22" fill="#edf7f2" >PASS and ROLLBACK for statistically</text><text x="638" y="400" font-size="22" fill="#edf7f2" >identical models.</text><text x="638" y="460" font-size="16" fill="#a8bbb2" >A gate gave opposing verdicts to two</text><text x="638" y="484" font-size="16" fill="#a8bbb2" >indistinguishable models.</text><rect x="56" y="555" width="532" height="310" rx="8" fill="#0d1f1a" /><text x="82" y="594" font-size="12" fill="#ff8f85" letter-spacing="1">C56 / TIMEOUT</text><text x="82" y="659" font-size="35" fill="#edf7f2" class="mono">300 seconds</text><text x="82" y="712" font-size="22" fill="#edf7f2" >Eleven “model” diagnoses were really a</text><text x="82" y="742" font-size="22" fill="#edf7f2" >client timeout.</text><text x="82" y="802" font-size="16" fill="#a8bbb2" >The HTTP client ended the request before the model</text><text x="82" y="826" font-size="16" fill="#a8bbb2" >could finish.</text><rect x="612" y="555" width="532" height="310" rx="8" fill="#0d1f1a" /><text x="638" y="594" font-size="12" fill="#ff8f85" letter-spacing="1">HEALTH BADGE / TARGET</text><text x="638" y="659" font-size="35" fill="#edf7f2" class="mono">The wrong machine</text><text x="638" y="712" font-size="22" fill="#edf7f2" >A health badge checked the wrong machine</text><text x="638" y="742" font-size="22" fill="#edf7f2" >for months.</text><text x="638" y="802" font-size="16" fill="#a8bbb2" >The indicator was measuring a different machine</text><text x="638" y="826" font-size="16" fill="#a8bbb2" >from the one it described.</text><line x1="56" y1="978" x2="1144" y2="978" stroke="#47d69933" /><text x="56" y="957" font-size="16" fill="#edf7f2" >Rule: check the instrument before the model.</text><text x="56" y="1012" font-size="12" fill="#a8bbb2" >MiganCore open release · source: BRIEF.md → instruments-failed-first</text></svg>